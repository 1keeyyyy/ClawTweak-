# ============================================================
#  ClawTweaks 汉化版云端构建 Workflow
#  用法：放到 fork 仓库的 .github/workflows/build.yml
#  触发：push 到任意分支，或手动在 Actions 页点 Run workflow
#  产物：ClawTweaks-zhCN-msix（含 .msix / 安装 exe / 测试证书 .pfx/.cer）
# ============================================================
name: Build ClawTweaks zh-CN

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022   # 预装 VS2022 企业版含 UWP 工作负载 + Windows 11 SDK 10.0.26100.0（无需再装）
    steps:
      - name: Checkout (含子模块 ADLX，必须 recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 设置 MSBuild
        uses: microsoft/setup-msbuild@v2

      # —— 阶段一：编译 widget（官方命令，关掉签名，纯验证汉化不破坏编译）——
      # 注：windows-2022 已预装 UWP 工作负载 + Win11 SDK 10.0.26100.0，无需额外安装
      - name: Restore & Build widget (no signing)
        run: |
          msbuild XboxGamingBar.sln /t:Restore /p:Configuration=Release /p:Platform=x64
          msbuild XboxGamingBar\XboxGamingBar.csproj /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=false

      # —— 阶段二前置：CI headless 环境下 GenerateTemporaryStoreCertificate 不会自动造证书，
      #    这里显式造一张自签测试证书，subject 必须与 Package.appxmanifest 的 Identity Publisher 完全一致
      #    （即 CN=ClawTweaks Dev, O=MSIClaw），否则签名阶段 APPX0107 报“证书无效”。
      #    指纹写入 $env:CTW_THUMB，密码写入 $env:CTW_PWD，供下一步打包使用。
      - name: 生成测试签名证书（subject 对齐 manifest Publisher）
        run: |
          $subj = "CN=ClawTweaks Dev, O=MSIClaw"
          $pwd = ConvertTo-SecureString -String "Cl4wTweaksCI" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subj -KeyUsage DigitalSignature -FriendlyName "ClawTweaks-CI" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfxPath = "XboxGamingBarPackage\XboxGamingBarPackage_TemporaryKey.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd
          Export-Certificate -Cert $cert -FilePath "XboxGamingBarPackage\XboxGamingBarPackage_TemporaryKey.cer"
          Add-Content -Path $env:GITHUB_ENV -Value "CTW_THUMB=$($cert.Thumbprint)"
          Add-Content -Path $env:GITHUB_ENV -Value "CTW_PWD=Cl4wTweaksCI"
          Write-Host "Generated test cert thumbprint: $($cert.Thumbprint)"

      # —— 阶段二：打包 MSIX（用上一步造好的测试证书签名）——
      - name: Package MSIX (explicit test cert)
        run: |
          msbuild XboxGamingBarPackage\XboxGamingBarPackage.wapproj /p:Configuration=Release /p:Platform=x64 /p:GenerateTemporaryStoreCertificate=false /p:PackageCertificateThumbprint=$env:CTW_THUMB /p:PackageCertificatePassword=$env:CTW_PWD

      # —— 上传产物：MSIX / 安装 exe / 证书 ——
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClawTweaks-zhCN-msix
          path: |
            XboxGamingBarPackage\AppPackages\**\*.msix*
            XboxGamingBarPackage\AppPackages\**\*.exe
            XboxGamingBarPackage\AppPackages\**\*.cer
            XboxGamingBarPackage\*.pfx
            XboxGamingBarPackage\*.cer
          if-no-files-found: warn
